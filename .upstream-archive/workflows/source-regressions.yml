permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (the versions scripts/linux/deps.sh builds the Vulkan back end with)
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 04f10f650d514df88b76d25e83db360142c7b174 # vulkan-sdk-1.4.341.0
          path: _deps/spirv-headers
          persist-credentials: false
      - name: Check out pinned Vulkan headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b # v1.4.345
          path: _deps/vulkan-headers
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # (the one package a test imports: nx2/test_nup_codec.py's zstandard. The runner itself needs none)
      - name: Python packages for the tests
        run: python -m pip install --disable-pip-version-check --no-deps zstandard==0.25.0
      - name: Compilers and the SPIR-V validator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ clang spirv-tools

      # (the steps below all run when one before them failed, so one run shows every failure)
      - name: Check Windows native source regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Visual Studio locator not found.
            exit /b 1
          )
          set "VSROOT="
          for /f "usebackq delims=" %%i in (`call "%VSWHERE%" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo Visual Studio 2022 C++ tools not found.
            exit /b 1
          )
          if not exist "%VSROOT%\Common7\Tools\VsDevCmd.bat" (
            echo Visual Studio developer command prompt not found.
            exit /b 1
          )
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fo"%TEMP%\present_rect_test.obj" /Fe:"%TEMP%\present_rect_test.exe" gpu\vk\tests\present_rect_test.cpp
          if errorlevel 1 exit /b 1
          "%TEMP%\present_rect_test.exe"
          if errorlevel 1 exit /b 1
          python -I -B tests/test_invalidate_vcore.py --cxx cl
          if errorlevel 1 exit /b 1
      - name: Check the Windows link's oldnames default
        run: python -I -B tests/test_msvc_oldnames.py
      - name: Check isolated child Unicode output
        run: python -I -B tests/test_child_unicode.py
      - name: Check CLI build logging
        run: python -I -B tests/test_build_log.py
      - name: Check packaged CPM discovery
        run: python -I -B tests/test_cpm_discovery.py
      - name: Check safe installation of built files
        run: python -I -B tests/test_finish_output.py
      - name: Check Vulkan swapchain surface compatibility
        run: python -I -B tests/test_vk_swapchain_compat.py
      - name: Check a failed step's error line
        run: python -I -B tests/test_failure_reason.py
      - name: Linux builder worker selection
        run: python -I -B tests/test_linux_builder_jobs.py
      - name: Set up .NET for Windows Builder checks
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Check Windows Builder worker delivery
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          dotnet restore tests/builder_workers/BuilderWorkersTests.csproj --configfile tests/builder_workers/NuGet.Config
          dotnet run --project tests/builder_workers/BuilderWorkersTests.csproj --configuration Release --no-restore -- (Get-Command python).Source
      - name: Compile Windows Builder
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: dotnet build builder/HookshotBuilder/HookshotBuilder.csproj --configuration Debug -p:NuGetAudit=false
      - name: Check the CPU target follows the CPU
        run: python -I -B tests/test_cpu_target.py
      - name: Check a missing compiler is said, not "game files"
        run: python -I -B tests/test_check_no_compiler.py
      - name: Check the py launcher's arguments
        run: python -I -B tests/test_builder_python.py
      - name: C++ compiler for the import-hold check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Check failed-import backoff
        if: runner.os == 'Linux'
        run: python -I -B tests/test_import_hold.py
      - name: Check the Linux builder's error sentences
        run: python -I -B tests/test_builder_status.py
      - name: Check Linux audio loads the SDL beside the game first
        run: python -I -B tests/test_sdl_audio_library.py
      - name: Check the Linux menu entry of a folder with % in its name
        if: runner.os == 'Linux'
        run: python -I -B tests/test_desktop_exec.py
      - name: Check Text speed scales only when asked
        if: runner.os == 'Linux'
        run: python -I -B tests/test_text_speed.py --cc gcc
      - name: Check the generic upscale fallback
        if: runner.os == 'Linux'
        run: python -I -B tests/test_upscale_fallback.py --cxx g++
      - name: Check uniform ranges cover generated table reads
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_cbuf_table_extent.py --cxx g++
      - name: Check SSBO diagnostics never read an unbound address
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_dump_ssbo_read.py --cxx g++
      - name: Check mesh and vertex dynamic state changes
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_mesh_dynamic_state.py --cxx g++
      - name: Check timeline fence values across the replay modes
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_timeline_modes.py --cxx g++
      - name: Check the C++ library preflight
        if: runner.os == 'Linux'
